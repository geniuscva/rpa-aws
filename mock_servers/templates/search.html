<!DOCTYPE html>
<html>
<head><title>Accuity - Search</title></head>
<body>
    <h1>Search Entities</h1>
    <form method="POST">
        <label>Entity Type:</label>
        <select id="entityType" name="entityType">
            <option value="Individual">Individual</option>
            <option value="Organization">Organization</option>
        </select><br><br>
        <label>Name:</label><input type="text" id="name" name="name"><br><br>
        <input type="checkbox" id="singleCheck" name="singleCheck" checked> <label for="singleCheck">Single</label><br><br>
        <button type="submit" id="searchBtn">Search</button>
    </form>
</body>
</html>
