<!DOCTYPE html>
<html>
<head><title>Accuity - Results</title></head>
<body>
    <h1>Search Results for {{ name }} ({{ entity_type }})</h1>
    <table border="1" id="resultsTable">
        <tr>
            <th>Name</th>
            <th>Match Score</th>
            <th>Action</th>
        </tr>
        <tr>
            <td>{{ name }}</td>
            <td class="matchScore">100</td>
            <td><a href="/record?name={{ name }}" id="openRecordBtn">Open Record</a></td>
        </tr>
    </table>
    <br>
    <a href="/export" id="exportPdfBtn"><button>Export PDF</button></a>
</body>
</html>
